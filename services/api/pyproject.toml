[project]
name = "sallimha-api"
version = "0.1.0"
description = "Sallimha valet operations API, domain services and worker"
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "djangorestframework==3.18.3",
    "psycopg[binary]>=3.3,<3.4",
    "phonenumbers>=9.0,<10",
    "cryptography>=50,<51",
    "pyotp>=2.11,<3",
    "drf-spectacular==0.30.0",
    "boto3>=1.42,<2",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "moto[s3]>=5.1,<6",
    "pytest>=9.2,<10",
    "pytest-django==4.14.0",
    "ruff>=0.17,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "sallimha.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:django.*"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "S311", "DJ008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]
"**/migrations/**" = ["E501"]
