# Local development only. Staging/production topology: docs/adr/0004-deployment-topology.md
name: sallimha
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: sallimha
      POSTGRES_PASSWORD: sallimha-local-only
      POSTGRES_DB: sallimha
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sallimha -d sallimha"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
