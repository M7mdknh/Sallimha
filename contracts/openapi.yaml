          description: null restores the catalogue wording for that message
      required:
      - overrides
      - version
    TicketDetail:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: string
        event_id:
          type: integer
        state:
          $ref: '#/components/schemas/TicketStateEnum'
        contact_state:
          $ref: '#/components/schemas/ContactStateEnum'
        phone_masked:
          type: string
          nullable: true
        vehicle:
          type: string
        plate:
          type: string
        location:
          type: string
        hook:
          type: integer
          nullable: true
        registered_by:
          type: string
        parked_by:
          type: string
          nullable: true
        assignee:
          type: string
          nullable: true
        parking_started:
          type: boolean
        request:
          allOf:
          - $ref: '#/components/schemas/TicketRequestBrief'
          nullable: true
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaBrief'
        holds:
          type: array
          items:
            $ref: '#/components/schemas/HoldBrief'
        incidents:
          type: array
          items:
            $ref: '#/components/schemas/IncidentBrief'
        move:
          allOf:
          - $ref: '#/components/schemas/MoveBrief'
          nullable: true
          description: A supervisor-initiated relocation in progress
        offered_to:
          type: string
          nullable: true
          description: Valet the system offered the open task to
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        allowed_actions:
          type: array
          items:
            type: string
          description: Exception actions the server will accept now
        primary_action:
          type: string
          nullable: true
          description: The one action to offer first, if any
        guest_messages:
          type: array
          items:
            $ref: '#/components/schemas/GuestMessageOut'
          description: What the customer wrote on WhatsApp (stored here)
        can_contact:
          type: boolean
          description: A number exists and may be opened (audited)
      required:
      - allowed_actions
      - assignee
      - can_contact
      - contact_state
      - event_id
      - guest_messages
      - holds
      - hook
      - id
      - incidents
      - location
      - media
      - move
      - offered_to
      - parked_by
      - parking_started
      - phone_masked
      - plate
      - primary_action
      - registered_by
      - request
      - state
      - ticket
      - timeline
      - vehicle
    TicketRequestBrief:
      type: object
      properties:
        id:
          type: integer
        state:
          $ref: '#/components/schemas/RequestStateEnum'
        requested_at:
          type: string
          format: date-time
      required:
      - id
      - requested_at
      - state
    TicketSearchRow:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: string
        state:
          $ref: '#/components/schemas/TicketStateEnum'
        vehicle:
          type: string
        location:
          type: string
        hook:
          type: integer
          nullable: true
      required:
      - hook
      - id
      - location
      - state
      - ticket
      - vehicle
    TicketStateEnum:
      enum:
      - RECEIVED
      - PARKED
      - RETRIEVING
      - READY
      - DELIVERED
      - CANCELLED
      - UNCLAIMED
      type: string
      description: |-
        * `RECEIVED` - RECEIVED
        * `PARKED` - PARKED
        * `RETRIEVING` - RETRIEVING
        * `READY` - READY
        * `DELIVERED` - DELIVERED
        * `CANCELLED` - CANCELLED
        * `UNCLAIMED` - UNCLAIMED
    TicketStateResponse:
      type: object
      properties:
        id:
          type: integer
        state:
          $ref: '#/components/schemas/TicketStateEnum'
      required:
      - id
      - state
    TimelineEntry:
      type: object
      properties:
        at:
          type: string
          format: date-time
        action:
          type: string
        actor:
          type: string
      required:
      - action
      - actor
      - at
    TimingsRequestRequest:
      type: object
      properties:
        version:
          type: integer
          minimum: 1
