          $ref: '#/components/schemas/ValetMe'
        shift:
          allOf:
          - $ref: '#/components/schemas/ValetShift'
          nullable: true
        assigned:
          allOf:
          - $ref: '#/components/schemas/ValetAssigned'
          nullable: true
        venue:
          allOf:
          - $ref: '#/components/schemas/ValetVenue'
          nullable: true
        customer_messages:
          $ref: '#/components/schemas/CustomerMessagesEnum'
        task:
          allOf:
          - $ref: '#/components/schemas/ValetTask'
          nullable: true
        recent:
          type: array
          items:
            $ref: '#/components/schemas/ValetRecent'
      required:
      - assigned
      - customer_messages
      - me
      - recent
      - server_time
      - shift
      - task
      - venue
    VenueRow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        time_zone:
          type: string
        zones:
          type: array
          items:
            type: string
        key_hooks:
          type: integer
      required:
      - id
      - key_hooks
      - name
      - time_zone
      - zones
    WhatsAppIntegration:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/WhatsAppStatusEnum'
        transport:
