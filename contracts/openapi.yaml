        timings:
          type: object
          additionalProperties:
            type: integer
      required:
      - timings
      - version
    TypeEnum:
      enum:
      - INTAKE
      - RETRIEVAL
      - RELOCATION
      type: string
      description: |-
        * `INTAKE` - INTAKE
        * `RETRIEVAL` - RETRIEVAL
        * `RELOCATION` - RELOCATION
    ValetAssigned:
      type: object
      properties:
        event:
          type: string
        venue:
          type: string
