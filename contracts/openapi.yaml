components:
  schemas:
    AlertAckResponse:
      type: object
      properties:
        id:
          type: integer
        acknowledged:
          type: boolean
      required:
      - acknowledged
      - id
    AttentionItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        created_at:
          type: string
          format: date-time
        ticket:
          type: string
          nullable: true
        ticket_id:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - kind
      - severity
      - ticket
      - ticket_id
    CarryoverRow:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: string
        ticket_id:
          type: integer
        event:
          type: string
        event_id:
          type: integer
        status:
          $ref: '#/components/schemas/CarryoverStatusEnum'
        custodian:
          type: string
        plan:
          type: string
        location:
          type: string
        hook:
          type: integer
          nullable: true
        proposed_at:
          type: string
          format: date-time
      required:
      - custodian
      - event
      - event_id
      - hook
      - id
      - location
      - plan
      - proposed_at
      - status
      - ticket
      - ticket_id
    CarryoverStatusEnum:
      enum:
      - PROPOSED
      - APPROVED
      - RELEASED
      type: string
      description: |-
        * `PROPOSED` - PROPOSED
        * `APPROVED` - APPROVED
        * `RELEASED` - RELEASED
    CategoryEnum:
      enum:
      - missing_vehicle
      - key_issue
      - damage
      - identity_dispute
      - notification_failure
      - operational_delay
      - complaint
      type: string
      description: |-
        * `missing_vehicle` - missing_vehicle
        * `key_issue` - key_issue
        * `damage` - damage
        * `identity_dispute` - identity_dispute
        * `notification_failure` - notification_failure
        * `operational_delay` - operational_delay
        * `complaint` - complaint
    ConfigResponse:
      type: object
      properties:
        version:
          type: integer
        timings:
          type: object
          additionalProperties:
            type: integer
        retention_days:
          type: object
          additionalProperties:
            type: integer
        template_overrides:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateCopy'
        catalogue:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateCopy'
        retention_preview:
          $ref: '#/components/schemas/RetentionPreview'
      required:
      - catalogue
      - retention_days
      - retention_preview
      - template_overrides
      - timings
      - version
    ConfirmedViaEnum:
      enum:
      - in_person
      - radio
      type: string
      description: |-
        * `in_person` - in_person
        * `radio` - radio
    ContactStateEnum:
      enum:
      - UNCONFIRMED
      - CONFIRMED_IN_PERSON
      - CORRECTION_REQUIRED
      - ASSISTED_FALLBACK
      type: string
      description: |-
        * `UNCONFIRMED` - UNCONFIRMED
        * `CONFIRMED_IN_PERSON` - CONFIRMED_IN_PERSON
        * `CORRECTION_REQUIRED` - CORRECTION_REQUIRED
        * `ASSISTED_FALLBACK` - ASSISTED_FALLBACK
    CreateEventRequestRequest:
      type: object
      properties:
        venue_id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 160
        starts_at_local:
          type: string
          minLength: 1
          description: Venue wall-clock time without an offset, e.g. 2026-12-01T19:00
          maxLength: 32
      required:
      - name
      - starts_at_local
      - venue_id
    CreateStaffRequestRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 40
        role:
          $ref: '#/components/schemas/RoleEnum'
        username:
          type: string
          maxLength: 150
        password:
          type: string
          maxLength: 256
      required:
      - full_name
      - phone
      - role
    CsrfResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DeadLetter:
      type: object
      properties:
        id:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/OutboxAttentionStatusEnum'
          description: |-
            DELIVERY_UNKNOWN: the recipient may already have it

            * `DEAD` - DEAD
            * `DELIVERY_UNKNOWN` - DELIVERY_UNKNOWN
        kind:
          type: string
        recipient:
          type: string
        ticket:
          type: string
          nullable: true
        failure_class:
          type: string
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - failure_class
      - id
      - kind
      - last_error
      - recipient
      - status
      - ticket
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - in
        * `out` - out
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable refusal code for the UI (e.g. confirmation_required)
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
    EventBrief:
