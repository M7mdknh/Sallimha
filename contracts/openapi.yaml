        signature_secret_set:
          type: boolean
        webhook_verification_set:
          type: boolean
      required:
      - sender_ready
      - signature_secret_set
      - status
      - transport
      - webhook_verification_set
    WhatsAppStatusEnum:
      enum:
      - simulated
      - configured
      - not_configured
      - degraded
      type: string
      description: |-
        * `simulated` - simulated
        * `configured` - configured
        * `not_configured` - not_configured
        * `degraded` - degraded
    WorkerEnum:
      enum:
      - ok
      - stale
      - missing
      - unknown
      type: string
      description: |-
        * `ok` - ok
        * `stale` - stale
        * `missing` - missing
        * `unknown` - unknown
    ZoneOut:
      type: object
