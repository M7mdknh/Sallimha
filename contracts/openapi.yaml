      - event
      - venue
    ValetCode:
      type: object
      properties:
        verified:
          type: boolean
        locked:
          type: boolean
        remaining:
          type: integer
      required:
      - locked
      - remaining
      - verified
    ValetCustody:
      type: object
      properties:
        transfer_id:
          type: integer
        vehicle_location:
          type: string
        key_location:
          type: string
        from_name:
          type: string
      required:
      - from_name
      - key_location
      - transfer_id
      - vehicle_location
    ValetEventBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        venue:
          type: string
      required:
      - id
      - name
      - venue
    ValetIntakeRequestRequest:
      type: object
      properties:
        guest_phone:
          type: string
          minLength: 1
          maxLength: 30
        vehicle:
          type: string
          minLength: 1
          description: Plate and/or a short description
          maxLength: 200
        language:
          allOf:
          - $ref: '#/components/schemas/LanguageEnum'
          default: ar
      required:
      - guest_phone
      - vehicle
    ValetIntakeResponse:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: string
      required:
      - id
      - ticket
    ValetMe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    ValetPhotoRequestRequest:
      type: object
      properties:
        photo:
          type: string
          format: binary
      required:
      - photo
    ValetRecent:
      type: object
      properties:
        ticket:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        at:
          type: string
          format: date-time
      required:
      - at
      - ticket
      - type
    ValetShift:
      type: object
      properties:
        id:
          type: integer
        availability:
          $ref: '#/components/schemas/AvailabilityEnum'
        assisted:
          type: boolean
          description: A supervisor records this valet's actions (device not working)
        event:
          $ref: '#/components/schemas/ValetEventBrief'
      required:
      - assisted
      - availability
      - event
      - id
    ValetTask:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/ValetTaskStatusEnum'
        step:
          allOf:
          - $ref: '#/components/schemas/StepEnum'
          description: |-
            The valet's next action

            * `photos` - photos
            * `receipt` - receipt
            * `start_parking` - start_parking
            * `park` - park
            * `offer` - offer
            * `custody_ack` - custody_ack
            * `bring` - bring
            * `code` - code
            * `deliver` - deliver
            * `move` - move
        deadline:
          type: string
          format: date-time
          nullable: true
          description: When an offer lapses
        reason:
          type: string
        ticket:
          $ref: '#/components/schemas/ValetTicket'
        code:
          allOf:
          - $ref: '#/components/schemas/ValetCode'
          nullable: true
        custody:
          allOf:
          - $ref: '#/components/schemas/ValetCustody'
          nullable: true
      required:
      - code
      - custody
      - deadline
      - id
      - reason
      - status
      - step
      - ticket
      - type
    ValetTaskStatusEnum:
      enum:
      - RESERVED
      - OFFERED
      - ACCEPTED
      type: string
      description: |-
        * `RESERVED` - RESERVED
        * `OFFERED` - OFFERED
        * `ACCEPTED` - ACCEPTED
    ValetTicket:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        vehicle:
          type: string
        location:
          type: string
        hook:
          type: integer
          nullable: true
        phone_masked:
          type: string
          nullable: true
          description: Never the full number
        photos:
          type: integer
        photos_required:
          type: integer
        contact_state:
          $ref: '#/components/schemas/ContactStateEnum'
        state:
          $ref: '#/components/schemas/TicketStateEnum'
        early_request:
          type: boolean
          description: The customer already asked for the car
        handover_blocked:
          type: boolean
      required:
      - contact_state
      - early_request
      - handover_blocked
      - hook
      - id
      - location
      - number
      - phone_masked
      - photos
      - photos_required
      - state
      - vehicle
    ValetVenue:
      type: object
      properties:
        zones:
