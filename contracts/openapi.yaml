components:
  schemas:
    AlertAckResponse:
      type: object
      properties:
        id:
          type: integer
        acknowledged:
          type: boolean
      required:
      - acknowledged
      - id
    AssistRequestRequest:
      type: object
      properties:
        'on':
          type: boolean
        reason:
          type: string
          maxLength: 200
      required:
      - 'on'
    AttentionItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        created_at:
          type: string
          format: date-time
        ticket:
          type: string
          nullable: true
        ticket_id:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - kind
      - severity
      - ticket
      - ticket_id
    AvailabilityEnum:
      enum:
      - available
      - unavailable
      - break_pending
      type: string
      description: |-
        * `available` - available
        * `unavailable` - unavailable
        * `break_pending` - break_pending
    AvailabilityRequestRequest:
      type: object
      properties:
        available:
          type: boolean
      required:
      - available
    AvailabilityResponse:
      type: object
      properties:
        availability:
          $ref: '#/components/schemas/AvailabilityEnum'
      required:
      - availability
    CarryoverRow:
      type: object
      properties:
        id:
          type: integer
        ticket:
          type: string
        ticket_id:
          type: integer
        event:
          type: string
        event_id:
          type: integer
        status:
          $ref: '#/components/schemas/CarryoverStatusEnum'
        custodian:
          type: string
        plan:
          type: string
        location:
          type: string
        hook:
          type: integer
          nullable: true
        proposed_at:
          type: string
          format: date-time
      required:
      - custodian
      - event
      - event_id
      - hook
      - id
      - location
      - plan
      - proposed_at
      - status
      - ticket
      - ticket_id
    CarryoverStatusEnum:
      enum:
      - PROPOSED
      - APPROVED
      - RELEASED
      type: string
      description: |-
        * `PROPOSED` - PROPOSED
        * `APPROVED` - APPROVED
        * `RELEASED` - RELEASED
    CategoryEnum:
      enum:
      - missing_vehicle
      - key_issue
      - damage
      - identity_dispute
      - notification_failure
      - operational_delay
      - complaint
      type: string
      description: |-
        * `missing_vehicle` - missing_vehicle
        * `key_issue` - key_issue
        * `damage` - damage
        * `identity_dispute` - identity_dispute
        * `notification_failure` - notification_failure
        * `operational_delay` - operational_delay
        * `complaint` - complaint
    CodeRequestRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 12
      required:
      - code
    CodeResponse:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/OutcomeEnum'
        remaining:
          type: integer
      required:
      - outcome
      - remaining
    ConfigResponse:
      type: object
      properties:
        version:
          type: integer
        timings:
          type: object
          additionalProperties:
            type: integer
        retention_days:
          type: object
          additionalProperties:
            type: integer
        template_overrides:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateCopy'
        catalogue:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateCopy'
        retention_preview:
          $ref: '#/components/schemas/RetentionPreview'
      required:
      - catalogue
      - retention_days
      - retention_preview
      - template_overrides
      - timings
      - version
    ConfirmedViaEnum:
      enum:
      - in_person
      - radio
      type: string
      description: |-
        * `in_person` - in_person
        * `radio` - radio
    ContactResponse:
      type: object
      properties:
        phone:
          type: string
          description: E.164; opened on request and audited. Contact happens outside
            Sallimha
      required:
      - phone
    ContactStateEnum:
      enum:
      - UNCONFIRMED
      - CONFIRMED_IN_PERSON
      - CORRECTION_REQUIRED
      - ASSISTED_FALLBACK
      type: string
      description: |-
        * `UNCONFIRMED` - UNCONFIRMED
        * `CONFIRMED_IN_PERSON` - CONFIRMED_IN_PERSON
        * `CORRECTION_REQUIRED` - CORRECTION_REQUIRED
        * `ASSISTED_FALLBACK` - ASSISTED_FALLBACK
    ContactStateResponse:
      type: object
      properties:
        id:
          type: integer
        contact_state:
          $ref: '#/components/schemas/ContactStateEnum'
      required:
      - contact_state
      - id
    CreateEventRequestRequest:
      type: object
      properties:
        venue_id:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 160
        starts_at_local:
          type: string
          minLength: 1
          description: Venue wall-clock time without an offset, e.g. 2026-12-01T19:00
          maxLength: 32
      required:
      - name
      - starts_at_local
      - venue_id
    CreateStaffRequestRequest:
      type: object
      description: 'No password: the person sets their own with a one-time setup code
        (ADR-0011).'
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: string
          minLength: 1
          maxLength: 40
        role:
          $ref: '#/components/schemas/RoleEnum'
        username:
          type: string
          description: Sign-in name; the mobile number when left empty
          maxLength: 150
        event_id:
          type: integer
          nullable: true
          description: Also put them on this team
      required:
      - full_name
      - phone
      - role
    CsrfResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    CustomerMessagesEnum:
      enum:
      - ok
      - delayed
      type: string
      description: |-
        * `ok` - ok
        * `delayed` - delayed
    Dashboard:
      type: object
      properties:
        event:
          $ref: '#/components/schemas/EventBrief'
        generated_at:
          type: string
          format: date-time
        cars:
          $ref: '#/components/schemas/DashboardCars'
        waiting_requests:
          type: integer
          description: Requested and not yet accepted by a valet
        delayed_requests:
          type: integer
          description: Waiting longer than delay_threshold_s
        delay_threshold_s:
          type: integer
        oldest_wait_s:
          type: integer
          nullable: true
        request_to_ready:
          allOf:
          - $ref: '#/components/schemas/StageStat'
          description: From the customer's request to the car ready at the pickup
            point
        problems:
          $ref: '#/components/schemas/DashboardProblems'
        team:
          $ref: '#/components/schemas/DashboardTeam'
      required:
      - cars
      - delay_threshold_s
      - delayed_requests
      - event
      - generated_at
      - oldest_wait_s
      - problems
      - request_to_ready
      - team
      - waiting_requests
    DashboardCars:
      type: object
      properties:
        receiving:
          type: integer
        parked:
          type: integer
        retrieving:
          type: integer
        ready:
          type: integer
        delivered:
          type: integer
      required:
      - delivered
      - parked
      - ready
      - receiving
      - retrieving
    DashboardMember:
      type: object
      properties:
        staff_id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/TeamStatusEnum'
        task:
          type: string
          nullable: true
        parked:
          type: integer
        delivered:
          type: integer
      required:
      - delivered
      - name
      - parked
      - staff_id
      - status
      - task
    DashboardProblems:
      type: object
      properties:
        alerts:
          type: integer
          description: Items needing attention that nobody has acknowledged
        critical:
          type: integer
        incidents:
          type: integer
          description: Incidents not yet resolved
        holds:
          type: integer
          description: Active safety holds
      required:
      - alerts
      - critical
      - holds
      - incidents
    DashboardTeam:
      type: object
      properties:
        available:
          type: integer
        busy:
          type: integer
        unavailable:
          type: integer
        not_started:
          type: integer
        members:
          type: array
          items:
            $ref: '#/components/schemas/DashboardMember'
      required:
      - available
      - busy
      - members
      - not_started
      - unavailable
    DeadLetter:
      type: object
      properties:
        id:
          type: integer
        status:
          allOf:
          - $ref: '#/components/schemas/OutboxAttentionStatusEnum'
          description: |-
            DELIVERY_UNKNOWN: the recipient may already have it

            * `DEAD` - DEAD
            * `DELIVERY_UNKNOWN` - DELIVERY_UNKNOWN
        kind:
          type: string
        recipient:
          type: string
        ticket:
          type: string
          nullable: true
        failure_class:
          type: string
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - created_at
      - failure_class
      - id
      - kind
      - last_error
      - recipient
      - status
      - ticket
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - in
        * `out` - out
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable refusal code for the UI (e.g. confirmation_required)
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
    EventBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        venue:
          type: string
        time_zone:
          type: string
      required:
      - id
      - name
      - status
      - time_zone
      - venue
    EventReport:
      type: object
      properties:
        event_id:
          type: integer
        outcomes:
          type: object
          additionalProperties:
            type: integer
        stages:
          $ref: '#/components/schemas/Stages'
        oldest_queued_at:
          type: string
          format: date-time
          nullable: true
        unresolved_incidents:
          type: integer
        ratings:
          type: object
          additionalProperties:
            type: integer
        hours:
          type: array
          items:
            $ref: '#/components/schemas/HoursRow'
      required:
      - event_id
      - hours
      - oldest_queued_at
      - outcomes
      - ratings
      - stages
      - unresolved_incidents
    EventStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
    EventSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        venue:
          type: string
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        starts_at:
          type: string
          format: date-time
        time_zone:
          type: string
          description: The venue's IANA time zone; console times are shown in it
      required:
      - id
      - name
      - starts_at
      - status
      - time_zone
      - venue
    GuestMessageOut:
      type: object
      properties:
        text:
          type: string
        received_at:
          type: string
          format: date-time
      required:
      - received_at
      - text
    Health:
      type: object
      properties:
        worker:
          $ref: '#/components/schemas/WorkerEnum'
        whatsapp:
          $ref: '#/components/schemas/WhatsAppStatusEnum'
      required:
