components:
  schemas:
    AlertAckResponse:
      type: object
      properties:
        id:
          type: integer
        acknowledged:
          type: boolean
      required:
      - acknowledged
      - id
    AttentionItem:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        severity:
          $ref: '#/components/schemas/SeverityEnum'
        created_at:
          type: string
          format: date-time
        ticket:
          type: string
          nullable: true
        ticket_id:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - kind
      - severity
      - ticket
      - ticket_id
    ContactStateEnum:
      enum:
      - UNCONFIRMED
      - CONFIRMED_IN_PERSON
      - CORRECTION_REQUIRED
      - ASSISTED_FALLBACK
      type: string
      description: |-
        * `UNCONFIRMED` - UNCONFIRMED
        * `CONFIRMED_IN_PERSON` - CONFIRMED_IN_PERSON
        * `CORRECTION_REQUIRED` - CORRECTION_REQUIRED
        * `ASSISTED_FALLBACK` - ASSISTED_FALLBACK
    CsrfResponse:
      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DirectionEnum:
      enum:
      - in
      - out
      type: string
      description: |-
        * `in` - in
        * `out` - out
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          description: Stable refusal code for the UI (e.g. confirmation_required)
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required:
      - code
    EventBrief:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        venue:
          type: string
      required:
      - id
      - name
      - status
      - venue
    EventStatusEnum:
      enum:
      - OPEN
      - CLOSED
      type: string
      description: |-
        * `OPEN` - OPEN
        * `CLOSED` - CLOSED
    EventSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        venue:
          type: string
        status:
          $ref: '#/components/schemas/EventStatusEnum'
        starts_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - starts_at
      - status
      - venue
    ExceptIntakeRequestKindEnum:
      enum:
      - photos
      - vehicle
      type: string
      description: |-
        * `photos` - photos
        * `vehicle` - vehicle
    ExceptIntakeRequestRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          $ref: '#/components/schemas/ExceptIntakeRequestKindEnum'
      required:
      - kind
      - reason
    Health:
      type: object
      properties:
        worker:
          $ref: '#/components/schemas/WorkerEnum'
        whatsapp:
          $ref: '#/components/schemas/WhatsappEnum'
      required:
      - whatsapp
      - worker
    HoldBrief:
      type: object
      properties:
        id:
          type: integer
        reason:
