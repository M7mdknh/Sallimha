name: ci

on:
  push:
    branches: [main, "build/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SALLIMHA_ENV: test
  DATABASE_URL: postgres://sallimha:sallimha-ci-only@127.0.0.1:5432/sallimha
  WHATSAPP_TRANSPORT: fake

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: sallimha
          POSTGRES_PASSWORD: sallimha-ci-only
          POSTGRES_DB: sallimha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sallimha" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: sallimha
          POSTGRES_PASSWORD: sallimha-ci-only
          POSTGRES_DB: sallimha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sallimha" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://sallimha:sallimha-ci-only@127.0.0.1:5432/sallimha
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm ci
        working-directory: apps/web
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
